<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OceanLumeGlow</title>
  <script src="https://telegram.org"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--tg-theme-bg-color, #17212b);
      color: var(--tg-theme-text-color, #ffffff);
      margin: 0; padding: 12px;
    }
    .header-card {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--tg-theme-secondary-bg-color, #232e3c);
      padding: 12px; border-radius: 14px; margin-bottom: 14px;
    }
    .header-title { font-weight: 700; font-size: 15px; }
    .header-sub { font-size: 12px; color: var(--tg-theme-hint-color, #8e9ba8); margin-top: 2px; }
    .sub-btn {
      background: var(--tg-theme-button-color, #2ea6ff);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none; padding: 8px 14px; border-radius: 10px;
      font-weight: 600; font-size: 13px; cursor: pointer; flex-shrink: 0;
    }
    .tabs {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      background: var(--tg-theme-secondary-bg-color, #232e3c);
      color: var(--tg-theme-text-color, #ffffff);
      border: none; padding: 8px 14px; border-radius: 20px;
      font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap;
    }
    .tab.active {
      background: var(--tg-theme-button-color, #2ea6ff);
      color: var(--tg-theme-button-text-color, #ffffff);
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .card {
      background: var(--tg-theme-secondary-bg-color, #232e3c);
      border-radius: 12px; overflow: hidden; cursor: pointer;
      display: flex; flex-direction: column;
    }
    .thumb-wrap { position: relative; width: 100%; aspect-ratio: 4/5; background: #0e1621; }
    .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .duration {
      position: absolute; bottom: 6px; right: 6px;
      background: rgba(0,0,0,0.75); color: #fff;
      font-size: 11px; padding: 2px 6px; border-radius: 6px; font-weight: 500;
    }
    .card-title {
      padding: 8px 10px; font-size: 13px; font-weight: 500; line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .empty { grid-column: 1 / -1; text-align: center; padding: 40px 0; opacity: 0.6; font-size: 14px; }
  </style>
</head>
<body>

  <div class="header-card">
    <div>
      <div class="header-title">OceanLumeGlow</div>
      <div class="header-sub">Подводный мир, дайвинг и фридайвинг</div>
    </div>
    <button class="sub-btn" onclick="openTgLink('https://t.me')">Подписаться</button>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="setFilter('all', this)">Все</button>
    <button class="tab" onclick="setFilter('snorkeling', this)">🐠 Рыбки</button>
    <button class="tab" onclick="setFilter('diving', this)">🤿 Дайвинг</button>
    <button class="tab" onclick="setFilter('freediving', this)">🫁 Фридайвинг</button>
  </div>

  <div class="grid" id="grid">
    <div class="empty">Загрузка видеотеки...</div>
  </div>

  <script>
    const CHANNEL = 'OceanLumeGlow';
    const TAG_MAP = {
      '#рыбки': 'snorkeling',
      '#снорклинг': 'snorkeling',
      '#дайвинг': 'diving',
      '#фридайвинг': 'freediving'
    };

    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) tg.expand();

    let allVideos = [];

    async function loadVideos() {
      const targetUrl = encodeURIComponent(`https://t.me{CHANNEL}`);
      let html = '';

      try {
        const res = await fetch(`https://allorigins.win{targetUrl}`);
        if (res.ok) {
          const data = await res.json();
          html = data.contents || '';
        }
      } catch (e) {}

      if (!html) {
        try {
          const res2 = await fetch(`https://corsproxy.io{targetUrl}`);
          if (res2.ok) html = await res2.text();
        } catch (e) {}
      }

      if (!html || !html.includes('tgme_widget_message')) {
        document.getElementById('grid').innerHTML = '<div class="empty">Не удалось загрузить ленту канала</div>';
        return;
      }

      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      const wraps = doc.querySelectorAll('.tgme_widget_message_wrap');
      const parsed = [];

      wraps.forEach(wrap => {
        const msgEl = wrap.querySelector('.tgme_widget_message');
        const thumbEl = wrap.querySelector('.tgme_widget_message_video_thumb');
        if (!msgEl || !thumbEl) return;

        const dataPost = msgEl.getAttribute('data-post') || '';
        const postId = parseInt(dataPost.split('/').at(1), 10);
        if (!postId) return;

        const style = thumbEl.getAttribute('style') || '';
        const match = style.match(/url\(['"]?([^'")]+)['"]?\)/);
        const thumb = match ? match.at(1) : '';

        const durEl = wrap.querySelector('.message_video_duration');
        const duration = durEl ? durEl.textContent.trim() : '';

        const textEl = wrap.querySelector('.tgme_widget_message_text');
        const rawText = textEl ? textEl.innerText : '';
        const lowerText = rawText.toLowerCase();

        const categories = [];
        for (const [tag, cat] of Object.entries(TAG_MAP)) {
          if (lowerText.includes(tag) && !categories.includes(cat)) {
            categories.push(cat);
          }
        }

        let cleanText = rawText;
        for (const tag of Object.keys(TAG_MAP)) {
          cleanText = cleanText.replace(new RegExp(tag, 'gi'), '');
        }
        const firstLine = cleanText.split('\n').map(s => s.trim()).find(Boolean) || `Видео #${postId}`;

        parsed.push({
          id: postId,
          title: firstLine,
          categories,
          thumb,
          duration,
          link: `https://t.me{CHANNEL}/${postId}`
        });
      });

      allVideos = parsed.sort((a, b) => b.id - a.id);
      render(allVideos);
    }

    function render(list) {
      const grid = document.getElementById('grid');
      if (!list.length) {
        grid.innerHTML = '<div class="empty">В этой рубрике пока нет видео</div>';
        return;
      }
      grid.innerHTML = list.map(v => `
        <div class="card" onclick="openTgLink('${v.link}')">
          <div class="thumb-wrap">
            <img src="${v.thumb}" loading="lazy" alt="">
            ${v.duration ? `<span class="duration">${v.duration}</span>` : ''}
          </div>
          <div class="card-title">${v.title}</div>
        </div>
      `).join('');
    }

    function setFilter(cat, btn) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      render(cat === 'all' ? allVideos : allVideos.filter(v => v.categories.includes(cat)));
    }

    function openTgLink(url) {
      if (tg && tg.initData) tg.openTelegramLink(url);
      else window.open(url, '_blank');
    }

    loadVideos();
  </script>
</body>
</html>
