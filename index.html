<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OceanLumeGlow</title>
  <script src="https://telegram.org"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--tg-theme-bg-color, #17212b);
      color: var(--tg-theme-text-color, #ffffff);
      margin: 0; padding: 12px;
    }
    .header-card {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--tg-theme-secondary-bg-color, #232e3c);
      padding: 12px; border-radius: 14px; margin-bottom: 14px;
    }
    .header-title { font-weight: 700; font-size: 15px; }
    .header-sub { font-size: 12px; color: var(--tg-theme-hint-color, #8e9ba8); margin-top: 2px; }
    .sub-btn {
      background: var(--tg-theme-button-color, #2ea6ff);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none; padding: 8px 14px; border-radius: 10px;
      font-weight: 600; font-size: 13px; cursor: pointer; flex-shrink: 0;
    }
    .tabs {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      background: var(--tg-theme-secondary-bg-color, #232e3c);
      color: var(--tg-theme-text-color, #ffffff);
      border: none; padding: 8px 14px; border-radius: 20px;
      font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap;
    }
    .tab.active {
      background: var(--tg-theme-button-color, #2ea6ff);
      color: var(--tg-theme-button-text-color, #ffffff);
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .card {
      background: var(--tg-theme-secondary-bg-color, #232e3c);
      border-radius: 12px; overflow: hidden; cursor: pointer;
      display: flex; flex-direction: column;
    }
    .thumb-wrap { position: relative; width: 100%; aspect-ratio: 4/5; background: #0e1621; }
    .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .duration {
      position: absolute; bottom: 6px; right: 6px;
      background: rgba(0,0,0,0.75); color: #fff;
      font-size: 11px; padding: 2px 6px; border-radius: 6px; font-weight: 500;
    }
    .card-title {
      padding: 8px 10px; font-size: 13px; font-weight: 500; line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    /* Модальное окно плеера */
    .modal {
      display: none; position: fixed; inset: 0; z-index: 100;
      background: var(--tg-theme-bg-color, #17212b);
      flex-direction: column;
    }
    .modal.open { display: flex; }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .close-btn {
      background: var(--tg-theme-secondary-bg-color, #232e3c);
      color: var(--tg-theme-text-color, #fff);
      border: none; padding: 6px 12px; border-radius: 8px;
      font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .player-box { width: 100%; aspect-ratio: 16/9; background: #000; flex-shrink: 0; }
    .player-box iframe { width: 100%; height: 100%; border: none; }
    .modal-body { padding: 16px; overflow-y: auto; flex: 1; }
    .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
    .modal-desc { font-size: 14px; line-height: 1.5; white-space: pre-line; opacity: 0.9; }
    .empty { grid-column: 1 / -1; text-align: center; padding: 40px 0; opacity: 0.6; font-size: 14px; }
  </style>
</head>
<body>

  <div class="header-card">
    <div>
      <div class="header-title">OceanLumeGlow</div>
      <div class="header-sub">Подводный мир, дайвинг и фридайвинг</div>
    </div>
    <button class="sub-btn" onclick="openChannel('https://t.me')">Подписаться</button>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="setFilter('all', this)">Все</button>
    <button class="tab" onclick="setFilter('snorkeling', this)">🐠 Рыбки</button>
    <button class="tab" onclick="setFilter('diving', this)">🤿 Дайвинг</button>
    <button class="tab" onclick="setFilter('freediving', this)">🫁 Фридайвинг</button>
  </div>

  <div class="grid" id="grid">
    <div class="empty">Загрузка видеотеки...</div>
  </div>

  <!-- Модальное окно с плеером -->
  <div class="modal" id="modal">
    <div class="modal-header">
      <span style="font-weight: 600; font-size: 14px;">Просмотр видео</span>
      <button class="close-btn" onclick="closeModal()">✕ Закрыть</button>
    </div>
    <div class="player-box" id="playerBox"></div>
    <div class="modal-body">
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-desc" id="modalDesc"></div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let allVideos = [];

    async function loadVideos() {
      try {
        const res = await fetch('./videos.json?v=' + Date.now());
        allVideos = await res.json();
        render(allVideos);
      } catch (e) {
        document.getElementById('grid').innerHTML = '<div class="empty">Видео скоро появятся...</div>';
      }
    }

    function render(list) {
      const grid = document.getElementById('grid');
      if (!list.length) {
        grid.innerHTML = '<div class="empty">В этой рубрике пока нет видео</div>';
        return;
      }
      grid.innerHTML = list.map((v, idx) => `
        <div class="card" onclick="openVideo(${v.owner_id}, ${v.id})">
          <div class="thumb-wrap">
            <img src="${v.thumb}" loading="lazy" alt="">
            <span class="duration">${v.duration}</span>
          </div>
          <div class="card-title">${v.title}</div>
        </div>
      `).join('');
    }

    function setFilter(cat, btn) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      render(cat === 'all' ? allVideos : allVideos.filter(v => v.categories.includes(cat)));
    }

    function openVideo(oid, id) {
      const video = allVideos.find(v => v.id === id);
      if (!video) return;
      document.getElementById('modalTitle').textContent = video.title;
      document.getElementById('modalDesc').textContent = video.description || '';
      document.getElementById('playerBox').innerHTML = `
        <iframe src="https://vk.com{oid}&id=${id}&hd=2&autoplay=1" 
                allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>
      `;
      document.getElementById('modal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('open');
      document.getElementById('playerBox').innerHTML = ''; // Останавливаем звук при закрытии
    }

    function openChannel(url) {
      if (tg.initData) tg.openTelegramLink(url);
      else window.open(url, '_blank');
    }

    loadVideos();
  </script>
</body>
</html>
