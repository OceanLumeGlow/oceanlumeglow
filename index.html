<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OceanLumeGlow</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1923;
      color: #ffffff;
      margin: 0; padding: 12px;
      max-width: 680px;
      margin-left: auto;
      margin-right: auto;
    }
    .header-card {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      background: linear-gradient(135deg, #162635 0%, #10324a 100%);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 14px 16px; border-radius: 16px; margin-bottom: 14px;
    }
    .header-title { font-weight: 700; font-size: 17px; letter-spacing: 0.2px; }
    .header-sub { font-size: 12px; color: #8fa6bc; margin-top: 3px; line-height: 1.3; }
    .sub-btn {
      background: #2ea6ff; color: #ffffff;
      border: none; padding: 9px 15px; border-radius: 12px;
      font-weight: 600; font-size: 13px; cursor: pointer; flex-shrink: 0;
    }
    .tabs {
      display: flex; gap: 6px; overflow-x: auto; padding-bottom: 12px;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      background: #182533; color: #c8d6e5;
      border: 1px solid rgba(255,255,255,0.06);
      padding: 7px 11px; border-radius: 18px;
      font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap;
      flex-shrink: 0;
    }
    .tab.active {
      background: #2ea6ff; color: #ffffff; border-color: #2ea6ff;
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: start; }
    .card {
      background: #182533;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px; overflow: hidden; cursor: pointer;
      display: flex; flex-direction: column;
      text-decoration: none; color: inherit;
    }
    .thumb-wrap {
      position: relative; width: 100%; aspect-ratio: 4/5;
      background: radial-gradient(circle at 30% 25%, #163d5c 0%, #0b2033 65%, #071420 100%);
      display: flex; align-items: center; justify-content: center;
    }
    .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .play-badge {
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(46, 166, 255, 0.18);
      border: 1px solid rgba(46, 166, 255, 0.45);
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; color: #ffffff; padding-left: 3px;
    }
    .duration {
      position: absolute; bottom: 8px; right: 8px;
      background: rgba(9, 18, 28, 0.78);
      color: #fff; font-size: 11px; padding: 3px 7px; border-radius: 8px; font-weight: 600;
    }
    .card-title {
      padding: 9px 10px; font-size: 13px; font-weight: 500; line-height: 1.35;
      color: #f0f4f8;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .empty { grid-column: 1 / -1; text-align: center; padding: 40px 0; color: #8fa6bc; font-size: 14px; }
  </style>
</head>
<body>

  <div class="header-card">
    <div>
      <div class="header-title">OceanLumeGlow</div>
      <div class="header-sub">Подводный мир, дайвинг и фридайвинг</div>
    </div>
    <button class="sub-btn" onclick="openChannel()">Подписаться</button>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="setFilter('all', this)">Все</button>
    <button class="tab" onclick="setFilter('snorkeling', this)">🐠 Рыбки</button>
    <button class="tab" onclick="setFilter('diving', this)">🤿 Дайвинг</button>
    <button class="tab" onclick="setFilter('freediving', this)">🫁 Фридайвинг</button>
  </div>

  <div class="grid" id="grid">
    <div class="empty">Загрузка видеотеки...</div>
  </div>

  <script>
    const CHANNEL = 'OceanLumeGlow';
    let allVideos = [];

    function fixLink(link, id) {
      if (link && link.includes('t.me/' + CHANNEL + '/')) return link;
      return ['https://t.me', CHANNEL, id].join('/');
    }

    function openChannel() {
      const latestId = allVideos.length ? allVideos[0].id : '';
      const url = latestId ? ['https://t.me', CHANNEL, latestId].join('/') : ['https://t.me', CHANNEL].join('/');
      openTgLink(url);
    }


    function openTgLink(url) {
      const tg = window.Telegram && window.Telegram.WebApp;
      if (tg && tg.openTelegramLink) {
        tg.openTelegramLink(url);
      } else {
        window.open(url, '_blank');
      }
    }

    function cleanTitle(raw) {
      const noTags = (raw || '').replace(/#[a-zA-Zа-яА-ЯёЁ0-9_]+/g, '').trim();
      if (!noTags || noTags.startsWith('Видео #')) return '';
      return noTags;
    }

    async function loadVideos() {
      try {
        const res = await fetch('./videos.json?v=' + Date.now());
        if (!res.ok) throw new Error();
        allVideos = await res.json();
        render(allVideos);
      } catch (e) {
        document.getElementById('grid').innerHTML = '<div class="empty">Видео скоро появятся</div>';
      }
    }

    function render(list) {
      const grid = document.getElementById('grid');
      if (!list.length) {
        grid.innerHTML = '<div class="empty">В этой рубрике пока нет видео</div>';
        return;
      }
      grid.innerHTML = list.map(function(v) {
        const durBadge = v.duration ? '<span class="duration">' + v.duration + '</span>' : '';
        const title = cleanTitle(v.title);
        const titleHtml = title ? '<div class="card-title">' + title + '</div>' : '';
        const safeUrl = fixLink(v.link, v.id);
        const fallback = '<div class="play-badge">▶</div>';

        const imgHtml = v.thumb
          ? '<img src="' + v.thumb + '" loading="lazy" alt="" onerror="this.outerHTML=\'<div class=play-badge>▶</div>\'">'
          : fallback;

        return '<div class="card" onclick="openTgLink(\'' + safeUrl + '\')">' +
          '<div class="thumb-wrap">' + imgHtml + durBadge + '</div>' +
          titleHtml +
        '</div>';
      }).join('');
    }

    function setFilter(cat, btn) {
      document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
      btn.classList.add('active');
      render(cat === 'all' ? allVideos : allVideos.filter(function(v) { return v.categories.includes(cat); }));
    }

    loadVideos();
  </script>
  <script src="https://telegram.org" defer></script>
</body>
</html>
